# Immich, as the Synology package runs it: the compose project in the immich
# shared folder. The setup container writes .env beside this.
#
# Images and versions are the ones in the docker-compose.yml of the Immich
# release this package pins (see IMMICH_VERSION in .env); the package moves
# to a newer Immich only with a package update, after backing up the database.
# Changes from Immich's own file, for a Synology: container names are the
# package's (immich-<service>); the database and the model cache live in
# Docker volumes; uploads go to the photos folder of the immich shared folder;
# photo folders you add in the DSM window are mounted read-only; machine
# learning runs only when it's switched on (the "ml" profile); and each
# container gets the variables it needs, not the whole .env.
services:
  server:
    image: ${IMMICH_IMAGE:-ghcr.io/immich-app/immich-server:v3.3.1}
    container_name: immich-server
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-2283}:2283"
    volumes:
      # Uploads, thumbnails and transcoded videos: the photos folder of this shared folder.
      - type: bind
        source: ${UPLOAD_SRC:-./photos}
        target: /data
        bind:
          create_host_path: false
      # Photo folders already on the Synology, read-only, at the same path they have on the NAS.
      # A slot not in use (or a folder that has gone) mounts an empty placeholder from this shared folder.
      - { type: bind, source: "${LIB1_SRC:-./no-library}", target: "${LIB1_DIR:-/mnt/unused/1}", read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: "${LIB2_SRC:-./no-library}", target: "${LIB2_DIR:-/mnt/unused/2}", read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: "${LIB3_SRC:-./no-library}", target: "${LIB3_DIR:-/mnt/unused/3}", read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: "${LIB4_SRC:-./no-library}", target: "${LIB4_DIR:-/mnt/unused/4}", read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: "${LIB5_SRC:-./no-library}", target: "${LIB5_DIR:-/mnt/unused/5}", read_only: true, bind: { create_host_path: false } }
    environment:
      TZ: ${TZ:-UTC}
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
      # Off, smart search and face recognition are off too (the machine-learning container isn't running).
      IMMICH_MACHINE_LEARNING_ENABLED: ${ML_ENABLED:-true}
      IMMICH_MACHINE_LEARNING_URL: http://machine-learning:3003
    depends_on:
      - redis
      - database
    healthcheck:
      disable: false

  machine-learning:
    image: ${ML_IMAGE:-ghcr.io/immich-app/immich-machine-learning:v3.3.1}
    container_name: immich-machine-learning
    profiles: ["ml"]
    restart: unless-stopped
    volumes:
      - models:/cache
    environment:
      TZ: ${TZ:-UTC}
      # Models leave memory after 5 idle minutes (Immich's default), so a quiet library costs little.
      MACHINE_LEARNING_MODEL_TTL: "300"
    healthcheck:
      disable: false

  redis:
    image: ${REDIS_IMAGE:-docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d}
    container_name: immich-redis
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1

  database:
    image: ${DB_IMAGE:-ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23}
    container_name: immich-database
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # Most Synology volumes are hard disks: Immich's setting for sequential IO.
      DB_STORAGE_TYPE: ${DB_STORAGE_TYPE:-HDD}
    volumes:
      - db:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      disable: false

volumes:
  db:
  models:

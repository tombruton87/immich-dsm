# Immich on the DSM app chassis. Read by chassis/build.sh and the tests.
PKG_NAME=immich
PKG_TITLE="Immich"
PKG_DESC="Immich, your own photo and video library with phone backup, in Container Manager with Postgres and Valkey — with a DSM window for photo libraries from your shared folders (read-only, scanned on demand), machine learning on or off for smaller Synologys, users and the administrator's password, phone setup with a QR code, database backups and careful updates."
APP_ID="Immich.AppInstance"
REPO=tombruton87/immich-dsm
SERVICES="server database redis"     # machine-learning is the app's own: on or off (app.sh)
VOLUMES="db models"
IMAGE_VARS="IMMICH_IMAGE DB_IMAGE REDIS_IMAGE"
PORT=2283
PORTS="2283 2284 2290 2383"
HEALTH_PATH=/api/server/ping
APP_ACTIONS="libadd|libscan|libdel|ml|useradd|adminpw"
APP_ANSWER_KEYS="ADMIN_EMAIL ADMIN_NAME_B64 PHOTO_DIR_B64 ML_ON"
APP_REQUEST_KEYS="LIB_DIR_B64 LIB_OWNER LIB_ID USER_EMAIL USER_NAME_B64 ROLE"
TAGLINE="photos and videos"
WELCOME="Immich backs up the photos and videos on your phones to your Synology and shows them in a fast timeline, with albums, sharing, a map, and — with machine learning on — search by what's in a photo and by face. This package runs it with its database in Container Manager, keeps uploads in its own shared folder, shows photo folders you already have (read-only), makes your administrator account, and adds an Immich window to DSM."
BACKUP_WHAT="a consistent dump of Immich's database (pg_dump, as Immich documents it): albums, people, faces, users, sharing and settings, and where every photo is. The photos and videos themselves are not in it — uploads are in the photos folder of this shared folder, so include the whole immich shared folder in Hyper Backup."
SITE_NOTE="Phones and browsers reach Immich at this address. For backing up away from home it must be reachable from outside — DSM's reverse proxy with a domain and a trusted certificate (steps below) is the usual way; the phone app follows the address on the Phones tab."
ICON_TOP="#2b3445"
ICON_BOTTOM="#121722"
ICON_LETTER="I"   # only if icon.png is missing
BETA=yes
